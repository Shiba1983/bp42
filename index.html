<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101011">
<title>Running Commu Check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
/* Layout: one narrow column like a race clipboard; tabs pinned to the bottom on phones, ink-inverted blocks for emphasis. */
:root{
  --paper:#f6f6f4; --ink:#101011; --ink-2:#5c5e62; --line:#d9d9d5; --tint:#ececE9; --card:#ffffff; --ok:#2d6b47;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e0e0f; --ink:#f1f1ee; --ink-2:#9b9da1; --line:#2a2a2c; --tint:#19191b; --card:#151517; --ok:#7cc79a; color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0e0e0f; --ink:#f1f1ee; --ink-2:#9b9da1; --line:#2a2a2c; --tint:#19191b; --card:#151517; --ok:#7cc79a; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:1001;background:var(--paper)}
.wrap{max-width:720px;margin:0 auto;padding-block:16px 110px;display:flex;flex-direction:column;gap:20px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.02em}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:900;font-size:34px;line-height:.95;letter-spacing:.01em;text-transform:uppercase}
h3{font-size:15px;font-weight:600}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:13px}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:900;font-size:28px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);letter-spacing:.1em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.store-pill{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:99px;padding:3px 9px;color:var(--ink-2);white-space:nowrap}
.store-pill.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--paper);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{background:none;border:0;padding:8px 2px;border-radius:var(--r);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-2)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button span{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--paper)}
@media (min-width:760px){
  nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding-inline:0}
  .wrap{padding-bottom:40px}
  nav.tabs button{flex-direction:row;justify-content:center;gap:8px}
}

main{display:flex;flex-direction:column;gap:30px}
.section{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=datetime-local],select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 11px;min-height:44px}
input:focus,select:focus{border-color:var(--ink);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r);border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;font-weight:500;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{min-height:34px;padding:0 11px;font-size:13px}
.btn.link{border:0;background:none;color:var(--ink-2);padding:0 6px;min-height:34px;text-decoration:underline;text-underline-offset:3px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chips{display:flex;gap:4px;background:var(--tint);padding:3px;border-radius:calc(var(--r) + 3px);width:max-content;max-width:100%;overflow-x:auto}
.chips button{border:0;background:none;padding:6px 12px;border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--ink-2);white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.hr{height:1px;background:var(--line)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed var(--ink-2);border-radius:var(--r);padding:10px 12px;font-size:13px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:1002;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--r);font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.18)}
@media (min-width:760px){.toast{bottom:28px}}

/* avatars: photos go greyscale to keep the page monochrome */
.av{--s:36px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-grid;place-items:center;overflow:hidden;background:var(--ink);color:var(--paper);
  font-family:var(--f-display);font-weight:900;font-size:calc(var(--s) * .45);letter-spacing:.02em;line-height:1;border:2px solid var(--card)}
.av img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05)}
.av.lg{--s:64px}.av.xl{--s:84px}.av.sm{--s:28px}

/* me card */
.me{display:flex;gap:14px;align-items:center}
.me .who{min-width:0;flex:1}
.me .who b{font-size:18px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mystats{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.mystats div{padding:10px 0;display:flex;flex-direction:column;gap:2px}
.mystats div+div{padding-left:14px;border-left:1px solid var(--line)}
.mystats b{font-family:var(--f-display);font-weight:900;font-size:40px;line-height:.9}

/* NFC panel */
.scan{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--ink);color:var(--paper);border-radius:10px;padding:18px}
.scan .label{color:color-mix(in srgb,var(--paper) 65%,transparent)}
.rings{width:112px;height:112px;position:relative;border:0;background:none;color:inherit;cursor:pointer;padding:0;border-radius:50%}
.rings i{position:absolute;inset:0;border-radius:50%;border:1.5px solid currentColor;opacity:.35}
.rings i:nth-child(2){inset:14px;opacity:.55}
.rings i:nth-child(3){inset:28px;opacity:.8}
.rings b{position:absolute;inset:40px;border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em}
.scanning .rings i{animation:pulse 2.2s ease-out infinite}
.scanning .rings i:nth-child(2){animation-delay:.35s}
.scanning .rings i:nth-child(3){animation-delay:.7s}
@keyframes pulse{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.08);opacity:0}}
@media (prefers-reduced-motion:reduce){.scanning .rings i{animation:none}}
.scan-txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.scan-txt strong{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1;text-transform:uppercase}
.scan-txt p{font-size:13px;opacity:.8}
.scan .btn{background:var(--paper);color:var(--ink);border-color:var(--paper);align-self:flex-start;min-height:38px}
@media (max-width:420px){.scan{grid-template-columns:1fr;justify-items:start}.rings{width:96px;height:96px}.rings b{inset:34px}}

.cps{display:flex;flex-direction:column;gap:8px}
.cp{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.cp.near{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cp .main{min-width:0}
.cp .main b{display:block}

.lastlap{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;border:2px solid var(--ink);border-radius:10px;padding:14px 16px}
.lastlap .big{font-family:var(--f-display);font-weight:900;font-size:56px;line-height:.85}
.lastlap .who{min-width:0}
.lastlap .who b{display:block;font-size:18px}

.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.feed li:last-child{border-bottom:0}
.feed .w{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed .d{font-family:var(--f-mono);font-size:12px;text-align:right;color:var(--ink-2)}

/* leaderboard */
.event-head{display:flex;flex-direction:column;gap:4px;border-top:2px solid var(--ink);padding-top:10px}
.event-head b{font-size:18px}
.totals{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.totals div{padding:8px 0 12px;display:flex;flex-direction:column;gap:2px}
.totals div+div{padding-left:14px;border-left:1px solid var(--line)}
.totals b{font-family:var(--f-display);font-weight:900;font-size:40px;line-height:.9}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.bib{background:var(--card);border:1.5px solid var(--ink);border-radius:8px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;min-width:0}
.bib::before,.bib::after{content:"";position:absolute;top:7px;width:6px;height:6px;border-radius:50%;border:1.5px solid var(--ink)}
.bib::before{left:7px}.bib::after{right:7px}
.bib .rk{font-family:var(--f-display);font-weight:900;line-height:.85;font-size:44px}
.bib.p1{background:var(--ink);color:var(--paper)}
.bib.p1::before,.bib.p1::after{border-color:var(--paper)}
.bib.p1 .rk{font-size:60px}
.bib.p1 .av{border-color:var(--ink);background:var(--paper);color:var(--ink)}
.bib .nm{font-weight:600;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bib .km{font-family:var(--f-mono);font-size:12px;opacity:.8;text-align:center}
.board{width:100%;border-collapse:collapse}
.board th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:400;text-align:left;padding:6px;border-bottom:1px solid var(--ink)}
.board td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.board td.r,.board th.r{text-align:right}
.board .rk{font-family:var(--f-display);font-weight:900;font-size:22px;width:34px}
.board .nm{display:flex;gap:10px;align-items:center;min-width:0}
.board .nm b{display:block;font-weight:600}
.board .nm small{color:var(--ink-2);font-size:12px}
.board .km{font-family:var(--f-mono);font-weight:500}
.board tr.mine td{background:var(--tint)}
.board tr.mine td:first-child{box-shadow:inset 3px 0 0 var(--ink)}

/* map */
.mapbox{position:relative;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--card)}
#mapEl,#sketch{display:block;width:100%;height:min(62vh,480px)}
#sketch{touch-action:manipulation}
.leaflet-container{background:var(--tint);font-family:var(--f-body)}
.leaflet-tile-pane{filter:grayscale(1)}
.leaflet-control-attribution{font-size:10px}
.leaflet-div-icon{background:none;border:0}
.pin-cp{width:16px;height:16px;background:var(--ink);border:2px solid var(--card);box-shadow:0 0 0 1.5px var(--ink)}
.pin-lbl{position:absolute;left:50%;top:44px;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:var(--paper);font:600 12px var(--f-body);padding:2px 6px;border-radius:3px}
.pin-run{position:relative}
.pin-run .av{box-shadow:0 1px 6px rgba(0,0,0,.35)}
.pin-run.me .av{border-color:var(--ink);outline:2px solid var(--card)}
.pin-me{width:14px;height:14px;border-radius:50%;background:#2a6fdb;border:3px solid #fff;box-shadow:0 0 0 6px rgba(42,111,219,.2)}
.map-tools{position:absolute;right:10px;bottom:10px;z-index:500;display:flex;gap:6px}
.map-tools .btn{background:var(--card);color:var(--ink);box-shadow:0 1px 6px rgba(0,0,0,.2)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);align-items:center}
.legend i{display:inline-block;vertical-align:-2px;margin-right:6px}
.onmap{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.onmap button{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;cursor:pointer;min-width:60px;padding:4px;border-radius:var(--r)}
.onmap button span{font-size:12px;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* runner tab */
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list li .main{min-width:0;display:flex;gap:10px;align-items:center;flex:1}
.list li .main>span:not(.av){min-width:0;display:flex;flex-direction:column}
.list li .main b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .stat{font-family:var(--f-mono);font-size:12px;text-align:right;white-space:nowrap}
.tag{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--ink-2)}
.tag.on{border-color:var(--ink);color:var(--ink)}
.profile{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;background:var(--card);border:1.5px solid var(--ink);border-radius:10px;padding:16px}
.profile form{display:flex;flex-direction:column;gap:10px;min-width:0}
.photo-btn{position:relative;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.photo-btn small{font-size:12px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
@media (max-width:420px){.profile{grid-template-columns:1fr}}
details.add{border:1px solid var(--line);border-radius:8px;background:var(--card)}
details.add summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.add summary::-webkit-details-marker{display:none}
details.add summary::after{content:"+";font-family:var(--f-mono)}
details.add[open] summary::after{content:"–"}
details.add .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:14px}
details.add form{display:flex;flex-direction:column;gap:10px}
.inline-confirm{display:flex;gap:6px;align-items:center;font-size:13px}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div class="brand"><b>Running Commu</b><span id="eventLine">Lap check-in</span></div>
    <span class="store-pill" id="storePill">Connecting…</span>
  </header>
  <div id="demoBanner" hidden class="banner"><span><b>Sample event.</b> These runners and laps are examples, and nothing you do here is saved.</span><button class="btn sm ghost" id="exitDemo">Leave sample</button></div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-tab="checkin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 8.5a8 8 0 0 1 0 7M9.5 6a12 12 0 0 1 0 12M13 4a16 16 0 0 1 0 16"/><circle cx="3.5" cy="12" r="1.2" fill="currentColor"/></svg><span>Check in</span></button>
  <button data-tab="board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20V13h5v7M9.5 20V8h5v12M15 20v-9h5v9M3 20h18"/></svg><span>Leaderboard</span></button>
  <button data-tab="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg><span>Map</span></button>
  <button data-tab="runner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="14.5" cy="4.5" r="2"/><path d="M8 21l3-6 3 2v4M6 12l3-4 4 1 2 4 3 1M11 15l2-6"/></svg><span>Runner</span></button>
</div></nav>

<input type="file" id="photoInput" accept="image/*" hidden>
<div class="toast" id="toast" hidden role="status"></div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script>
(() => {
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const COLS = ["groups", "members", "checkpoints", "checkins", "event"];
const COOLDOWN_MS = 45 * 1000;
const DAY = 864e5;

/* ---------- per-viewer prefs (convenience only) ---------- */
const prefs = (() => {
  let p = {};
  try { p = JSON.parse(localStorage.getItem("rc2.prefs") || "{}"); } catch {}
  return { get: (k, d) => (k in p ? p[k] : d), set: (k, v) => { p[k] = v; try { localStorage.setItem("rc2.prefs", JSON.stringify(p)); } catch {} } };
})();

/* ---------- store: Supabase when config.js is filled in, else this browser only ---------- */
const CFG = window.RC_CONFIG || {};
const blank = () => ({ groups: {}, members: {}, checkpoints: {}, checkins: {}, event: {} });
const TABLE = { members: "profiles", groups: "groups", checkpoints: "checkpoints", checkins: "checkins", event: "events" };
const iso = ms => (ms ? new Date(ms).toISOString() : null);
const toRow = {
  members: o => ({ id: o.id, name: o.name, group_id: o.groupId || null, photo: o.photo || null }),
  groups: o => ({ id: o.id, name: o.name }),
  checkpoints: o => ({ id: o.id, name: o.name, km: o.km, lat: o.lat ?? null, lng: o.lng ?? null, tag: o.tag || null }),
  checkins: o => ({ id: o.id, member_id: o.memberId, checkpoint_id: o.checkpointId, km: o.km, lat: o.lat ?? null, lng: o.lng ?? null, acc: o.acc ?? null, via: o.via }),
  event: o => ({ id: o.id, name: o.name, starts_at: iso(o.startsAt), ends_at: iso(o.endsAt) })
};
const fromRow = {
  members: r => ({ id: r.id, name: r.name, groupId: r.group_id || "", photo: r.photo || "" }),
  groups: r => ({ id: r.id, name: r.name }),
  checkpoints: r => ({ id: r.id, name: r.name, km: +r.km, lat: r.lat, lng: r.lng, tag: r.tag || "" }),
  checkins: r => ({ id: r.id, memberId: r.member_id, checkpointId: r.checkpoint_id, km: +r.km, ts: Date.parse(r.ts), lat: r.lat, lng: r.lng, acc: r.acc, via: r.via }),
  event: r => ({ id: r.id, name: r.name, startsAt: Date.parse(r.starts_at), endsAt: r.ends_at ? Date.parse(r.ends_at) : null })
};

/* ---------- sample event (demo mode only) ---------- */
function makeSample() {
  const d = blank();
  const now = Date.now(), t0 = new Date(); t0.setHours(6, 0, 0, 0); let start = t0.getTime(); if (start > now - 30 * 60e3) start = now - 2 * 36e5;
  d.event.e1 = { id: "e1", name: "Sunday 10K Social", startsAt: start };
  [["g1", "Dawn Patrol"], ["g2", "Tempo Crew"], ["g3", "Sunday Long Run"]].forEach(([id, name]) => d.groups[id] = { id, name });
  d.checkpoints.c1 = { id: "c1", name: "Lumpini Loop", km: 2.5, lat: 13.73135, lng: 100.54135, tag: "04:9f:02:aa:61:10:90" };
  d.checkpoints.c2 = { id: "c2", name: "Benjakitti Loop", km: 1.8, lat: 13.72985, lng: 100.55740, tag: "04:9f:02:aa:61:11:90" };
  const names = [["Ploy", "g1"], ["Krit", "g2"], ["Mina", "g1"], ["Arun", "g3"], ["Nok", "g2"], ["Ben", "g3"], ["Fah", ""], ["Tee", "g2"], ["Ice", "g3"], ["June", "g1"]];
  names.forEach(([n, gid], i) => d.members["m" + i] = { id: "m" + i, name: n, groupId: gid });
  d.members.me = { id: "me", name: "Sam", groupId: "g1" };
  let seed = 20261027; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647; for (let i = 0; i < 20; i++) rnd();
  let n = 0;
  Object.values(d.members).forEach(m => {
    const cp = rnd() < 0.6 ? d.checkpoints.c1 : d.checkpoints.c2, laps = m.id === "me" ? 2 : 1 + Math.floor(rnd() * 5);
    let t = start + rnd() * 20 * 60e3;
    for (let l = 0; l < laps; l++) {
      t += cp.km * (300 + rnd() * 140) * 1000; if (t > now) break;
      const id = "k" + n++;
      d.checkins[id] = { id, memberId: m.id, checkpointId: cp.id, km: cp.km, ts: Math.round(t), lat: cp.lat + (rnd() - .5) * .0006, lng: cp.lng + (rnd() - .5) * .0006, via: "nfc" };

/* ---------- stats (current event only) ---------- */
function eventCheckins() {
  const ev = event(), s = ev?.startsAt || 0, e = ev?.endsAt || Infinity;

}
function memberStats() {
  const m = new Map();
  for (const mem of all("members")) m.set(mem.id, { mem, laps: 0, km: 0, last: 0 });
  for (const c of eventCheckins()) { const s = m.get(c.memberId); if (s) { s.laps++; s.km += +c.km || 0; s.last = Math.max(s.last, c.ts); } }
  return [...m.values()].sort((a, b) => b.km - a.km || b.laps - a.laps || a.last - b.last || nameOf(a.mem).localeCompare(nameOf(b.mem)));
}
function groupStats() {
  const g = new Map();
  for (const gr of all("groups")) g.set(gr.id, { gr, laps: 0, km: 0, members: 0, active: 0 });
  for (const s of memberStats()) { const x = g.get(s.mem.groupId); if (!x) continue; x.members++; x.laps += s.laps; x.km += s.km; if (s.laps) x.active++; }
  return [...g.values()].sort((a, b) => b.km - a.km || b.laps - a.laps);
}
const fmtKm = k => (k >= 100 ? k.toFixed(0) : k.toFixed(1));
const fmtTime = ts => new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
const fmtWhen = ts => { const d = new Date(ts), t = new Date(); t.setHours(0,0,0,0); return d >= t ? fmtTime(ts) : d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " + fmtTime(ts); };

  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };

/* ---------- GPS ---------- */
const gps = { pos: null, err: "", watching: false };
function getPosition(timeout = 4000) {
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    try {
      navigator.geolocation.getCurrentPosition(p => { gps.pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, ts: Date.now() }; gps.err = ""; res(gps.pos); },
        e => { gps.err = e.code === 1 ? "Location is off for this page." : "Couldn't get your location."; res(null); }, { enableHighAccuracy: true, timeout, maximumAge: 30000 });
    } catch { res(null); }

}

/* ---------- check-in ---------- */
let lastLap = null;
async function checkIn(cpId, via) {
  const m = me(), cp = Store.data.checkpoints[cpId];
  if (!m) { toast("Join the event first, then check in."); return; }
  if (!cp) return;
  const recent = all("checkins").find(c => c.memberId === m.id && c.checkpointId === cpId && Date.now() - c.ts < COOLDOWN_MS);
  if (recent) { toast(`You already checked in at ${cp.name} a moment ago.`); buzz([40, 60, 40]); return; }
  const pos = gps.pos && Date.now() - gps.pos.ts < 60e3 ? gps.pos : await getPosition(3000);
  const rec = { memberId: m.id, checkpointId: cpId, km: +cp.km, ts: Date.now(), via };
  if (pos) Object.assign(rec, { lat: pos.lat, lng: pos.lng, acc: Math.round(pos.acc || 0) });
  else if (hasLoc(cp)) Object.assign(rec, { lat: +cp.lat, lng: +cp.lng });
  await Store.put("checkins", rec);
  const mine = eventCheckins().filter(c => c.memberId === m.id);
  const rank = memberStats().findIndex(s => s.mem.id === m.id) + 1;
  lastLap = { cp: cp.name, lap: mine.length, km: mine.reduce((s, c) => s + (+c.km || 0), 0), rank, ts: Date.now() };
  buzz(120); render();
}

/* ---------- NFC (Web NFC: Chrome on Android over HTTPS) ---------- */
const nfc = { supported: "NDEFReader" in window, active: false, abort: null, err: "", pendingField: null };
async function startNfc() {
  if (!nfc.supported) { toast("This browser can't read NFC. Use Chrome on Android, or check in with the buttons below."); return; }
  try {
    const reader = new NDEFReader(); nfc.abort = new AbortController();
    await reader.scan({ signal: nfc.abort.signal });
    reader.onreading = e => onTag(e.serialNumber, e.message);
    reader.onreadingerror = () => toast("Couldn't read that tag. Hold it still against the back of the phone.");
    nfc.active = true; nfc.err = ""; prefs.set("nfcOn", true);
  } catch (e) {
    nfc.active = false;
    nfc.err = e?.name === "NotAllowedError" ? "NFC permission was refused. Allow NFC for this site in Chrome settings." : e?.name === "NotSupportedError" ? "NFC is off or missing on this phone. Turn it on in Android settings." : "NFC couldn't start here. Open the app from its own web address in Chrome on Android.";
  }

}
function stopNfc() { try { nfc.abort?.abort(); } catch {} nfc.active = false; prefs.set("nfcOn", false); render(); }

}
let unknownTag = null;

  if (nfc.pendingField) { const f = $("#" + nfc.pendingField); if (f) f.value = id; nfc.pendingField = null; toast("Tag captured: " + id); render(); return; }
  const cp = id.startsWith("rc:cp:") ? Store.data.checkpoints[id.slice(6)] : all("checkpoints").find(c => c.tag && normTag(c.tag) === id);
  if (cp) checkIn(cp.id, via);
  else { unknownTag = id; buzz([30, 40, 30]); tab = "checkin"; render(); }
}

    <details class="add" id="dGroups"><summary>Groups (optional) · ${groups.length}</summary><div class="body">
      <p class="muted small">Groups are optional. Runners pick one in their profile, and the leaderboard adds a groups view.</p>
      <form data-form="group" class="row" style="flex-wrap:nowrap"><input type="text" id="gName" required placeholder="New group, e.g. Dawn Patrol" maxlength="30"><button class="btn" type="submit">Create</button></form>
      ${groups.length ? `<ul class="list">${groups.map(g => `<li><span class="main"><span><b>${esc(g.name)}</b><span class="muted small">${cnt(g.id)} runner${cnt(g.id) === 1 ? "" : "s"}</span></span></span>${Store.admin ? del("groups", g.id) : ""}</li>`).join("")}</ul>` : ""}
    </div></details>
    ${Store.admin ? `<details class="add" id="dSetup" ${!cps.length && m ? "open" : ""}><summary>Event setup</summary><div class="body">
      <form data-form="event"><span class="label">Event</span>
        <div class="grid2"><label class="field"><span class="label">Name</span><input type="text" id="eName" maxlength="40" placeholder="Sunday 10K Social" value="${esc(ev?.name || "")}"></label>
        <label class="field"><span class="label">Laps count from</span><input type="datetime-local" id="eStart" value="${toLocal(ev?.startsAt)}"></label></div>
        <div class="row"><button class="btn" type="submit">Save event</button><button type="button" class="btn ghost" data-act="event-now">Start a new event now</button></div>
        <p class="muted small">Starting a new event resets the leaderboard. Earlier laps stay saved.</p></form>
      <div class="hr"></div>
      <span class="label">Checkpoints · ${cps.length}</span>
      ${cps.length ? `<ul class="list">${cps.map(c => `<li><span class="main"><span><b>${esc(c.name)} · ${c.km} km lap</b><span class="muted small mono">${c.tag ? "Tag " + esc(c.tag) : "No NFC tag"} · ${hasLoc(c) ? (+c.lat).toFixed(5) + ", " + (+c.lng).toFixed(5) : "no location"}</span></span></span>${del("checkpoints", c.id)}</li>`).join("")}</ul>` : ""}
      <form data-form="cp"><span class="label">Add a checkpoint</span>
        <div class="grid2"><label class="field"><span class="label">Name</span><input type="text" id="cName" required placeholder="Start arch" maxlength="30"></label>
        <label class="field"><span class="label">Lap distance (km)</span><input type="number" id="cKm" required min="0.05" max="100" step="0.01" placeholder="2.5"></label></div>
        <label class="field"><span class="label">Location (latitude, longitude)</span><span class="row" style="flex-wrap:nowrap"><input type="text" id="cLoc" placeholder="13.73135, 100.54135"><button type="button" class="btn sm ghost" data-act="cp-here">Use my location</button></span></label>
        <label class="field"><span class="label">NFC tag on the checkpoint</span><span class="row" style="flex-wrap:nowrap"><input type="text" id="cTag" placeholder="Scan it, or type its ID">${scanBtn("cTag")}</span></label>
        <button class="btn" type="submit">Add checkpoint</button>
        <p class="muted small">Tip: in Google Maps, long-press the spot to copy its coordinates.</p></form>
      <div class="hr"></div>
      <form data-form="sim" class="row" style="flex-wrap:nowrap"><input type="text" id="simTag" placeholder="Test a tag ID without NFC"><button class="btn ghost" type="submit">Simulate tap</button></form>
    </div></details>` : ""}
    ${Store.mode === "cloud" ? `<button class="btn ghost sm" style="align-self:flex-start" data-act="signout">Sign out</button>` : ""}
    <p class="muted small">${Store.mode === "cloud" ? `Signed in as ${esc(Store.email)}.` : Store.mode === "demo" ? "You're looking at a sample event." : "No database is connected yet, so this copy keeps its data on this device only."}</p>
  </section>`;
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.closest("nav.tabs")) { tab = b.dataset.tab; prefs.set("tab", tab); try { history.replaceState(null, "", "#" + tab); } catch {} render(); window.scrollTo(0, 0); return; }
  if (b.dataset.go) { tab = b.dataset.go; render(); return; }
  if (b.dataset.kind) { boardKind = b.dataset.kind; render(); return; }
  if (b.dataset.checkin) { checkIn(b.dataset.checkin, "button"); return; }
  if (b.dataset.focus) { focusRunner = b.dataset.focus; if (mapState.mode === "tiles") drawLeaflet(); return; }
  if (b.dataset.ask) { confirmDel = b.dataset.ask; render(); return; }
  if (b.dataset.del) { const [c, id] = b.dataset.del.split(":"); confirmDel = null;
    if (c === "groups" && Store.mode !== "cloud") all("members").filter(m => m.groupId === id).forEach(m => Store.put("members", { ...m, groupId: "" }));
    Store.remove(c, id); return; }
  if (b.dataset.scanfor) { nfc.pendingField = b.dataset.scanfor; if (!nfc.active) startNfc(); else render(); return; }
  switch (b.dataset.act) {
    case "demo": Store.enterDemo(); mapState.fitted = false; tab = "checkin"; render(); break;
    case "nfc-start": startNfc(); break;
    case "auth-toggle": authMode = authMode === "signup" ? "signin" : "signup"; authNote = ""; render(); break;
    case "auth-reset": { const email = $("#aEmail")?.value.trim(); if (!email) { authNote = "Type your email first, then press Forgot password."; render(); break; }
      const { error } = await Store.sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }); authNote = error ? error.message : "We emailed you a link to set a new password."; render(); break; }
    case "signout": await Store.sb.auth.signOut(); tab = "checkin"; break;
    case "nfc-stop": stopNfc(); break;
    case "photo": pickPhoto(); break;
    case "photo-remove": { const m = me(); const { photo, ...rest } = m; Store.put("members", rest); break; }
    case "locate": case "map-locate": { const p = await getPosition(8000); if (!p) toast((gps.err || "Couldn't get your location.") + "");
      else if (b.dataset.act === "map-locate" && mapState.map) mapState.map.setView([p.lat, p.lng], 17); render(); break; }
    case "map-fit": mapState.fitted = false; if (mapState.mode === "tiles") drawLeaflet(); else drawSketch(); break;
    case "dismiss-tag": unknownTag = null; render(); break;
    case "link-tag": { const id = $("#linkTag")?.value; if (!id) return; const cp = Store.data.checkpoints[id]; Store.put("checkpoints", { ...cp, tag: unknownTag }); toast(`Tag linked to ${cp.name}.`); unknownTag = null; break; }
    case "del-cancel": confirmDel = null; render(); break;
    case "event-now": { const ev = event(); Store.put("event", { name: ev?.name || "Running Commu event", startsAt: Date.now() }); toast("New event started. The leaderboard is reset."); break; }
    case "cp-here": { const p = await getPosition(8000); if (p) { $("#cLoc").value = p.lat.toFixed(6) + ", " + p.lng.toFixed(6); toast(`Location set (within ${Math.round(p.acc)} m).`); }
      else toast("Location isn't available here. Type the coordinates instead, for example from Google Maps."); break; }
  }
});
document.addEventListener("input", e => { if (e.target.id && e.target.closest("#view")) e.target.dataset.dirty = ""; });
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target.dataset.form, v = id => $("#" + id)?.value.trim() || "";
  if (f === "auth") { const email = v("aEmail"), password = $("#aPass").value; authBusy = true; authNote = ""; render();
    (authMode === "signup" ? Store.sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } }) : Store.sb.auth.signInWithPassword({ email, password }))
      .then(({ data, error }) => { authBusy = false;
        if (error) authNote = /invalid login/i.test(error.message) ? "That email and password don't match. Try again, or reset your password." : /fetch|network/i.test(error.message) ? "Can't reach the server. Check your connection and try again." : error.message;
        else if (authMode === "signup" && !data.session) { authNote = "Almost done. Open the link we emailed you, then sign in here."; authMode = "signin"; }
        render(); });
    return; }
  if (f === "newpass") { Store.sb.auth.updateUser({ password: $("#nPass").value }).then(({ error }) => { if (error) toast(error.message); else { Store.recovery = false; toast("Password saved."); render(); } }); return; }
  if (f === "join") { if (!v("jName")) return; Store.put("members", { id: Store.meId, name: v("jName"), groupId: v("jGroup"), ...(draftPhoto ? { photo: draftPhoto } : {}), joined: Date.now() }); draftPhoto = null; toast("You're in. Tap the checkpoint tag to log your first lap."); }
  if (f === "profile") { const m = me(); Store.put("members", { ...m, name: v("pName") || m.name, groupId: v("pGroup") }); toast("Profile saved."); }
  if (f === "group") { if (!v("gName")) return; Store.put("groups", { name: v("gName") }); $("#gName").value = ""; toast("Group created."); }
  if (f === "event") { const t = v("eStart") ? new Date(v("eStart")).getTime() : (event()?.startsAt || Date.now()); Store.put("event", { id: event()?.id, name: v("eName") || "Running Commu event", startsAt: t }); toast("Event saved."); }
  if (f === "cp") { const km = parseFloat(v("cKm")); if (!v("cName") || !(km > 0)) return;
    const ll = v("cLoc").split(/[,\s]+/).map(Number).filter(Number.isFinite);
    if (v("cLoc") && (ll.length !== 2 || Math.abs(ll[0]) > 90 || Math.abs(ll[1]) > 180)) { toast("Location should look like 13.73135, 100.54135."); return; }
    Store.put("checkpoints", { name: v("cName"), km, tag: v("cTag") ? normTag(v("cTag")) || v("cTag") : "", ...(ll.length === 2 ? { lat: ll[0], lng: ll[1] } : {}) });
    toast(`${v("cName")} added.`); ["cName", "cKm", "cLoc", "cTag"].forEach(id => $("#" + id).value = ""); }
  if (f === "sim") { const t = v("simTag"); if (!t) return; handleTagId(t.startsWith("rc:") ? t : normTag(t) || t, "nfc"); }
});
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (mapState.mode === "sketch") drawSketch(); else mapState.map?.invalidateSize(); }, 120); });
const redrawTheme = () => { if (mapState.mode === "sketch") drawSketch(); else if (mapState.tiles) { const dark = getComputedStyle(document.documentElement).colorScheme === "dark"; mapState.tiles.setUrl(`https://{s}.basemaps.cartocdn.com/${dark ? "dark_all" : "light_all"}/{z}/{x}/{y}{r}.png`); } };
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", redrawTheme);
new MutationObserver(redrawTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
$("#exitDemo").addEventListener("click", () => { Store.exitDemo(); mapState.fitted = false; });
document.fonts?.ready?.then(() => { if (tab === "map" && mapState.mode === "sketch") drawSketch(); });

render();
Store.init().then(() => { if (prefs.get("nfcOn") && nfc.supported && me()) startNfc(); });
})();
</script>
</body>
</html>
